name: Create Docker Image (Release and Staging)

on:
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - release

env:
  REPO: ${{ github.repository }}
  # ———————— Registry 改为 Docker Hub ————————
  REGISTRY: docker.io                        # ★ 原来是 ghcr.io
  # ―――― 新增从 Secrets 读取的 Docker Hub 用户名 ――――
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  build:
    if: github.repository == 'SillyTavern/SillyTavern'
    runs-on: ubuntu-latest

    steps:
      - name: Set lowercase repo name
        run: |
          echo "IMAGE_NAME=${REPO,,}" >> $GITHUB_ENV

      # ———————— 合并 Checkout 步骤 ————————
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'staging' || 'release' }}
        # ★ 根据 trigger 类型自动选分支：schedule → staging，其它(包括 release/push) → release

      - name: Get current branch name
        run: echo "BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ———————— 修改 metadata-action 目标镜像 ————————
      - name: Extract metadata (tags, labels)
        uses: docker/metadata-action@v5.5.1
        id: metadata
        with:
          # ★ 改为 Docker Hub 上的命名空间：docker.io/<用户名>/<镜像名>
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ github.event_name == 'release' && github.ref_name || env.BRANCH_NAME }}
            ${{ github.event_name == 'push' && env.BRANCH_NAME == 'release' && 'latest' || '' }}

      # ———————— 登录到 Docker Hub ————————
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}               # ★ docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}     # ★ 从 Secrets 读取用户名
          password: ${{ secrets.DOCKER_HUB_TOKEN }}   # ★ 从 Secrets 读取 Access Token

      # ———————— 保留多架构构建并推送 ————————
      - name: Build and push
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
